<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Yunqian Vision · Telemetry & Digital Twin</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #111620;
    --panel-2: #161d2b;
    --border: rgba(148, 163, 184, 0.14);
    --border-strong: rgba(148, 163, 184, 0.24);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --dim: #64748b;
    --cyan: #38bdf8;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --purple: #c084fc;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: var(--sans); overflow: hidden;
    display: flex; flex-direction: column;
  }

  /* ---- 顶部遥测栏 ---- */
  #topbar {
    height: 40px; flex: 0 0 40px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.4px; color: var(--text);
    white-space: nowrap;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim); box-shadow: 0 0 0 2px rgba(100,116,139,0.2);
    transition: background .2s, box-shadow .2s;
  }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,0.65); }
  .dot.err { background: var(--red); box-shadow: 0 0 8px rgba(248,113,113,0.55); }

  .kpi-strip {
    display: flex; align-items: center; gap: 8px;
    overflow: hidden;
  }
  .pill {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    background: var(--panel-2); border: 1px solid var(--border);
    font-size: 12px; font-family: var(--mono); color: var(--text);
    white-space: nowrap;
  }
  .pill .k-lbl { color: var(--muted); font-family: var(--sans); font-size: 11px; }
  .pill.fire-on {
    background: rgba(251, 191, 36, 0.14);
    border-color: rgba(251, 191, 36, 0.45);
    color: var(--amber);
  }

  .top-actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 6px;
    padding: 4px 10px; font-size: 11px; font-family: var(--sans);
    cursor: pointer; transition: background .15s, border-color .15s, color .15s;
    white-space: nowrap;
  }
  .btn:hover { background: #1e293b; border-color: rgba(148, 163, 184, 0.4); }
  .btn.primary {
    background: rgba(56, 189, 248, 0.14);
    border-color: rgba(56, 189, 248, 0.45);
    color: #bae6fd;
  }
  .btn.primary:hover { background: rgba(56, 189, 248, 0.24); }
  .btn.active {
    background: rgba(52, 211, 153, 0.16);
    border-color: rgba(52, 211, 153, 0.5);
    color: #a7f3d0;
  }

  /* ---- 主工作区 ---- */
  #main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    padding: 8px; gap: 8px;
  }
  #top-row {
    flex: 1 1 66%; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  #bottom-row {
    flex: 0 0 33%; min-height: 185px; max-height: 280px;
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 8px;
  }

  .card {
    position: relative; min-width: 0; min-height: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .card-canvas {
    width: 100%; height: 100%; display: block;
  }

  /* 浮层标题与图例（克制毛玻璃） */
  .hud-top {
    position: absolute; top: 8px; left: 10px; right: 10px;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none; gap: 8px; z-index: 2;
  }
  .hud-chip {
    background: rgba(11, 14, 20, 0.68);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 11px; color: var(--text);
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap;
  }
  .hud-chip.mono { font-family: var(--mono); color: var(--muted); }
  .hud-bottom {
    position: absolute; bottom: 8px; left: 10px; right: 10px;
    display: flex; align-items: center; justify-content: space-between;
    pointer-events: none; z-index: 2;
  }
  .sw { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .leg-item { color: var(--muted); font-size: 11px; }

  /* 底部右卡：弹道闭环工作台（左右分栏，零重叠） */
  #corr-card {
    display: flex; flex-direction: column;
  }
  .card-head {
    flex: 0 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(22, 29, 43, 0.55);
    font-size: 12px; font-weight: 500;
  }
  .card-head .sub { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; }

  #corr-body {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 190px 1fr;
    gap: 10px; padding: 8px 12px;
    align-items: center;
  }
  #corr-plot-wrap {
    width: 100%; height: 100%; min-height: 120px; position: relative;
  }
  #corr-info {
    display: flex; flex-direction: column; justify-content: space-between;
    height: 100%; gap: 8px; min-width: 0;
  }
  .stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  .stat-box {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 8px;
  }
  .stat-box .s-lbl { font-size: 10px; color: var(--dim); margin-bottom: 2px; }
  .stat-box .s-val { font-size: 12px; font-family: var(--mono); color: var(--text); }
  .stat-box .s-val.cyan { color: var(--cyan); }
  .stat-box .s-val.green { color: var(--green); }
  .stat-box .s-val.amber { color: var(--amber); }

  .corr-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .corr-btns { display: flex; align-items: center; gap: 6px; }
  #corrToast {
    font-size: 11px; font-family: var(--mono); color: var(--amber);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #corr-empty {
    flex: 1; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    color: var(--dim); font-size: 12px;
  }
  #corr-empty code {
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 5px; color: var(--muted); font-family: var(--mono);
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">
    <span id="connDot" class="dot"></span>
    <span>YUNQIAN VISION</span>
  </div>
  <div class="kpi-strip">
    <div class="pill"><span class="k-lbl">目标</span><span id="kpiTarget">--</span></div>
    <div class="pill"><span class="k-lbl">重建命中</span><span id="kpiHit">0.0% (0/0)</span></div>
    <div class="pill" id="kpiSimHitPill" style="display:none"><span class="k-lbl">仿真实际</span><span id="kpiSimHit">0.0% (0/0)</span></div>
    <div class="pill"><span class="k-lbl">跟踪 RMS</span><span id="kpiRms">--</span></div>
    <div class="pill" id="kpiFirePill"><span class="k-lbl">火控</span><span id="kpiFire">IDLE</span></div>
  </div>
  <div class="top-actions">
    <button id="btnResetMetrics" class="btn" type="button">清除弹丸统计</button>
    <button id="btnResetCam" class="btn" type="button">复位 3D 视角</button>
  </div>
</div>

<div id="main">
  <div id="top-row">
    <!-- 左上：相机画面与 2D 叠加 -->
    <div class="card">
      <canvas id="view" class="card-canvas"></canvas>
      <div class="hud-top">
        <div class="hud-chip">相机感知与投影</div>
        <div class="hud-chip">
          <span class="leg-item"><span class="sw" style="background:var(--green)"></span>锁定板</span>
          <span class="leg-item"><span class="sw" style="background:var(--red)"></span>预测板</span>
          <span class="leg-item"><span class="sw" style="background:var(--amber)"></span>弹道</span>
          <span id="corrLegend" style="display:none">
            <span class="leg-item"><span class="sw" style="background:#22d3ee"></span>虚拟弹</span>
            <span class="leg-item"><span class="sw" style="background:var(--purple)"></span>检出弹</span>
          </span>
        </div>
      </div>
    </div>

    <!-- 右上：3D 数字孪生 -->
    <div class="card">
      <canvas id="scene" class="card-canvas"></canvas>
      <div class="hud-top">
        <div class="hud-chip">3D 数字孪生</div>
        <div class="hud-chip mono">左键旋转 · 滚轮缩放 · 双击复位</div>
      </div>
      <div class="hud-bottom">
        <div id="status" class="hud-chip mono">等待数据...</div>
      </div>
    </div>
  </div>

  <div id="bottom-row">
    <!-- 左下：云台跟踪与命中率曲线 -->
    <div class="card">
      <div class="card-head">
        <span>云台跟踪与命中率</span>
        <span id="yawMeta" class="sub">等待连接...</span>
      </div>
      <div style="flex:1; min-height:0; position:relative;">
        <canvas id="yawChart" class="card-canvas"></canvas>
        <div class="hud-top" style="top:6px;">
          <div class="hud-chip">
            <span class="leg-item"><span class="sw" style="background:var(--cyan)"></span>目标角</span>
            <span class="leg-item"><span class="sw" style="background:var(--green)"></span>炮口角</span>
            <span class="leg-item"><span class="sw" style="background:#94a3b8"></span>预补偿指令</span>
            <span class="leg-item"><span class="sw" style="background:var(--purple)"></span>重建命中率</span>
            <span class="leg-item"><span class="sw" style="background:var(--amber)"></span>仿真实际命中率</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 右下：弹道闭环工作台 -->
    <div class="card" id="corr-card">
      <div class="card-head">
        <span>弹道闭环 AimCorrector</span>
        <span id="corrMeta" class="sub">未启用</span>
      </div>
      <div id="corr-empty">
        <div>未启用视觉弹道闭环</div>
        <div>启动命令加入 <code>--corrector</code> 开启</div>
      </div>
      <div id="corr-body">
        <div id="corr-plot-wrap">
          <canvas id="corrChart" class="card-canvas"></canvas>
        </div>
        <div id="corr-info">
          <div class="stat-grid">
            <div class="stat-box">
              <div class="s-lbl">稳健偏差 (观测 − 模型)</div>
              <div id="stErr" class="s-val cyan">--</div>
            </div>
            <div class="stat-box">
              <div class="s-lbl">样本散布 (±1σ)</div>
              <div id="stSigma" class="s-val">--</div>
            </div>
            <div class="stat-box">
              <div class="s-lbl">当前零偏 offset</div>
              <div id="stCur" class="s-val green">--</div>
            </div>
            <div class="stat-box">
              <div class="s-lbl" id="stSugLbl">建议零偏 offset</div>
              <div id="stSug" class="s-val amber">--</div>
            </div>
          </div>
          <div class="corr-bar">
            <div class="corr-btns">
              <button id="btnCorrApply" class="btn primary" type="button">应用建议</button>
              <button id="btnCorrAuto" class="btn" type="button">自动: OFF</button>
              <button id="btnCorrClear" class="btn" type="button">清空</button>
            </div>
            <span id="corrToast"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from './vendor/three.module.js';

// ---- 与 configs/sim.yaml 一致的内外参 ----
const FX = 1304.673, FY = 1304.673, CX = 720, CY = 540;
const R_C2G = [[0, 0.422618, 0.906308], [-1, 0, 0], [0, -0.906308, 0.422618]];
const G = 9.7833;
const BULLET_SPEED = 25;
const MUZZLE_Z = 0.097;
const ARMOR_W = 0.135;
const ARMOR_H = 0.056;
const ARMOR_PHYS_H = 0.125;

// ---- 小矩阵工具 ----
const mul = (A, B) => A.map(r => [0, 1, 2].map(j =>
  r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
const T = A => [0, 1, 2].map(i => [0, 1, 2].map(j => A[j][i]));
const mv = (A, v) => [0, 1, 2].map(i => A[i][0] * v[0] + A[i][1] * v[1] + A[i][2] * v[2]);
const rz = a => [[Math.cos(a), -Math.sin(a), 0], [Math.sin(a), Math.cos(a), 0], [0, 0, 1]];
const ry = a => [[Math.cos(a), 0, Math.sin(a)], [0, 1, 0], [-Math.sin(a), 0, Math.cos(a)]];
const rx = a => [[1, 0, 0], [0, Math.cos(a), -Math.sin(a)], [0, Math.sin(a), Math.cos(a)]];

let R_W2C = null;
function setGimbal(yaw, pitch) {
  const R_G2W = mul(rz(yaw), ry(pitch));
  R_W2C = mul(T(R_C2G), T(R_G2W));
}
function project(p) {
  if (!R_W2C) return null;
  const c = mv(R_W2C, p);
  if (c[2] <= 0.05) return null;
  return [FX * c[0] / c[2] + CX, FY * c[1] / c[2] + CY];
}

// ---- 状态与历史 ----
let state = null;
let videoState = null;
const stateByImgId = new Map();
let frameImage = null;
let lastCenter = null, vel = [0, 0, 0], lastStamp = 0;

const HISTORY_WINDOW_S = 3.5;
const yawHistory = [];
let historyT0 = null;
let unwrappedGimbal = null;

const TRAIL_MAX_POINTS = 120;
const selfTrailWorld = [];
const enemyTrailWorld = [];
const seenHitIds = new Set();
const activeHitFx = [];
const armorFlashUntil = [0, 0, 0, 0];
let lastTrailPushMs = 0;

function wrapDeg(d) { return ((d + 540) % 360) - 180; }

function pushHistory(s) {
  const t = (s.stamp_ns || 0) / 1e9;
  const relPrev = yawHistory.length ? yawHistory[yawHistory.length - 1].t : 0;
  if (historyT0 === null || t < historyT0 || (yawHistory.length && (t - historyT0) < relPrev - 0.5)) {
    yawHistory.length = 0;
    historyT0 = t;
    unwrappedGimbal = null;
  }
  const relT = t - historyT0;
  const deg = 180 / Math.PI;
  const mz = s.muzzle || s.gimbal;
  const rawG = mz[0] * deg;
  if (unwrappedGimbal === null) unwrappedGimbal = rawG;
  else unwrappedGimbal += wrapDeg(rawG - unwrappedGimbal);

  const rawCmd = s.command[1] * deg;
  const rawRef = (s.ref ? s.ref[0] : s.command[1]) * deg;
  const m = s.metrics || { hit_rate: 0 };

  yawHistory.push({
    t: relT,
    gimbal: unwrappedGimbal,
    ref: unwrappedGimbal + wrapDeg(rawRef - unwrappedGimbal),
    cmd: unwrappedGimbal + wrapDeg(rawCmd - unwrappedGimbal),
    control: !!s.command[0],
    shoot: !!s.command[3],
    hitRate: (m.hit_rate || 0) * 100,
    hasSim: !!m.has_sim,
    simHitRate: (m.sim_hit_rate || 0) * 100,
  });
  const cutoff = relT - HISTORY_WINDOW_S;
  while (yawHistory.length > 2 && yawHistory[0].t < cutoff) yawHistory.shift();
}

function updateMotionAndHits(s) {
  const sp = s.self_pos || [0, 0, 0];
  const nowMs = performance.now();

  if (s.hit_events && s.hit_events.length) {
    for (const h of s.hit_events) {
      if (seenHitIds.has(h.id)) continue;
      seenHitIds.add(h.id);
      if (seenHitIds.size > 200) seenHitIds.delete(seenHitIds.values().next().value);
      activeHitFx.push({ x: h.x, y: h.y, z: h.z, armorId: h.armor_id, bornMs: nowMs });
      if (h.armor_id >= 0 && h.armor_id < armorFlashUntil.length) {
        armorFlashUntil[h.armor_id] = nowMs + 260;
      }
    }
  }
  while (activeHitFx.length && (nowMs - activeHitFx[0].bornMs) > 460) activeHitFx.shift();

  if (s.tracked && s.target_center && s.target_vel) {
    lastCenter = [s.target_center[0], s.target_center[1], s.target_center[2]];
    vel = [s.target_vel[0], s.target_vel[1], s.target_vel[2]];
    lastStamp = s.stamp_ns;
  } else if (!s.armors.length) {
    lastCenter = null; vel = [0, 0, 0];
  } else {
    const c = [0, 0, 0];
    for (const a of s.armors) { c[0] += a[0]; c[1] += a[1]; c[2] += a[2]; }
    for (let i = 0; i < 3; i++) c[i] /= s.armors.length;
    const dt = (s.stamp_ns - lastStamp) / 1e9;
    if (lastCenter && dt > 1e-4 && dt < 0.5) {
      const raw = [0, 1, 2].map(i => (c[i] - lastCenter[i]) / dt);
      for (let i = 0; i < 3; i++) vel[i] = vel[i] * 0.8 + raw[i] * 0.2;
    }
    lastCenter = c; lastStamp = s.stamp_ns;
  }

  if (nowMs - lastTrailPushMs >= 33) {
    lastTrailPushMs = nowMs;
    if (selfTrailWorld.length) {
      const prev = selfTrailWorld[selfTrailWorld.length - 1];
      if (Math.hypot(sp[0] - prev[0], sp[1] - prev[1], sp[2] - prev[2]) > 2.5) {
        selfTrailWorld.length = 0;
        enemyTrailWorld.length = 0;
      }
    }
    selfTrailWorld.push([sp[0], sp[1], sp[2]]);
    if (selfTrailWorld.length > TRAIL_MAX_POINTS) selfTrailWorld.shift();
    if (lastCenter) {
      enemyTrailWorld.push([sp[0] + lastCenter[0], sp[1] + lastCenter[1], sp[2] + lastCenter[2]]);
      if (enemyTrailWorld.length > TRAIL_MAX_POINTS) enemyTrailWorld.shift();
    }
  }
}

// ---- DOM 引用 ----
const connDot = document.getElementById('connDot');
const kpiTarget = document.getElementById('kpiTarget');
const kpiHit = document.getElementById('kpiHit');
const kpiRms = document.getElementById('kpiRms');
const kpiFire = document.getElementById('kpiFire');
const kpiFirePill = document.getElementById('kpiFirePill');
const btnResetCam = document.getElementById('btnResetCam');

const view = document.getElementById('view');
const vctx = view.getContext('2d');
const status = document.getElementById('status');
const yawChart = document.getElementById('yawChart');
const yawCtx = yawChart.getContext('2d');
const yawMeta = document.getElementById('yawMeta');

const corrChart = document.getElementById('corrChart');
const corrCtx = corrChart.getContext('2d');
const corrMeta = document.getElementById('corrMeta');
const corrBody = document.getElementById('corr-body');
const corrEmpty = document.getElementById('corr-empty');
const corrLegend = document.getElementById('corrLegend');
const corrToast = document.getElementById('corrToast');
const stErr = document.getElementById('stErr');
const stSigma = document.getElementById('stSigma');
const stCur = document.getElementById('stCur');
const stSug = document.getElementById('stSug');
const stSugLbl = document.getElementById('stSugLbl');
const btnCorrApply = document.getElementById('btnCorrApply');
const btnCorrAuto = document.getElementById('btnCorrAuto');
const btnCorrClear = document.getElementById('btnCorrClear');

let corrToastTimer = null;
function showCorrToast(msg) {
  corrToast.textContent = msg || '';
  if (corrToastTimer) clearTimeout(corrToastTimer);
  corrToastTimer = setTimeout(() => { corrToast.textContent = ''; }, 3000);
}
async function callCorrApi(url) {
  try {
    const res = await fetch(url);
    const data = await res.json();
    showCorrToast(data.msg || (data.ok ? 'OK' : '失败'));
  } catch {
    showCorrToast('请求失败');
  }
}
btnCorrApply.addEventListener('click', () => callCorrApi('/api/corrector/apply'));
btnCorrClear.addEventListener('click', () => callCorrApi('/api/corrector/clear'));
btnCorrAuto.addEventListener('click', () => {
  const cur = !!(state && state.corrector && state.corrector.auto_apply);
  callCorrApi(`/api/corrector/auto?v=${cur ? 0 : 1}`);
});
const btnResetMetrics = document.getElementById('btnResetMetrics');
if (btnResetMetrics) {
  btnResetMetrics.addEventListener('click', async () => {
    try {
      const res = await fetch('/api/metrics/reset');
      const data = await res.json();
      if (data && data.ok) {
        yawHistory.length = 0;
        historyT0 = null;
        kpiHit.textContent = '0.0% (0/0)';
        const simHitEl = document.getElementById('kpiSimHit');
        if (simHitEl) simHitEl.textContent = '0.0% (0/0)';
      }
    } catch {}
  });
}

// ---- WebSocket ----
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.binaryType = 'arraybuffer';
ws.onopen = () => { connDot.className = 'dot ok'; };
ws.onmessage = ev => {
  if (typeof ev.data === 'string') {
    state = JSON.parse(ev.data);
    if (state.img_id && !stateByImgId.has(state.img_id)) {
      stateByImgId.set(state.img_id, state);
      if (stateByImgId.size > 40) {
        stateByImgId.delete(stateByImgId.keys().next().value);
      }
    }
    setGimbal(state.gimbal[0], state.gimbal[1]);
    updateMotionAndHits(state);
    pushHistory(state);
    updateTopBar(state);
  } else {
    const view = new DataView(ev.data);
    const imgId = view.byteLength > 4 ? view.getUint32(0, true) : 0;
    const jpegBytes = view.byteLength > 4 ? ev.data.slice(4) : ev.data;
    const url = URL.createObjectURL(new Blob([jpegBytes], { type: 'image/jpeg' }));
    const img = new Image();
    img.onload = () => {
      if (frameImage && frameImage._url) URL.revokeObjectURL(frameImage._url);
      img._url = url;
      frameImage = img;
      videoState = (imgId && stateByImgId.get(imgId)) || state;
    };
    img.src = url;
  }
};

// ---- 抛物线预览 ----
function solveTrajectory(v0, d, h) {
  const a = G * d * d / (2 * v0 * v0), b = -d, c = a + h;
  const delta = b * b - 4 * a * c;
  if (delta < 0) return null;
  const p1 = Math.atan((-b + Math.sqrt(delta)) / (2 * a));
  const p2 = Math.atan((-b - Math.sqrt(delta)) / (2 * a));
  const t1 = d / (v0 * Math.cos(p1)), t2 = d / (v0 * Math.cos(p2));
  return t1 < t2 ? { pitch: p1, fly: t1 } : { pitch: p2, fly: t2 };
}

function trajectoryPoints(s) {
  if (!s.tracked || !s.aim[0]) return null;
  const aim = [s.aim[1], s.aim[2], s.aim[3]];
  const d = Math.hypot(aim[0], aim[1]);
  if (d < 0.3) return null;
  const sol = solveTrajectory(BULLET_SPEED, d, aim[2] - MUZZLE_Z);
  if (!sol) return null;
  const yaw = Math.atan2(aim[1], aim[0]);
  const pts = [];
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const t = sol.fly * i / N;
    const horiz = BULLET_SPEED * Math.cos(sol.pitch) * t;
    const z = MUZZLE_Z + BULLET_SPEED * Math.sin(sol.pitch) * t - 0.5 * G * t * t;
    pts.push([horiz * Math.cos(yaw), horiz * Math.sin(yaw), z]);
  }
  return pts;
}

// ---- 左上：2D 相机视图 ----
function drawView() {
  const dpr = window.devicePixelRatio || 1;
  const w = view.clientWidth || 1, h = view.clientHeight || 1;
  if (view.width !== Math.round(w * dpr) || view.height !== Math.round(h * dpr)) {
    view.width = Math.round(w * dpr);
    view.height = Math.round(h * dpr);
  }
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vctx.fillStyle = '#090c11';
  vctx.fillRect(0, 0, w, h);
  if (!frameImage) return;

  const iw = frameImage.width, ih = frameImage.height;
  const scale = Math.min(w / iw, h / ih);
  const ox = (w - iw * scale) / 2, oy = (h - ih * scale) / 2;
  vctx.drawImage(frameImage, ox, oy, iw * scale, ih * scale);
  const vs = videoState || state;
  if (!vs) return;

  const sp = p => {
    const q = project(p);
    return q ? [ox + q[0] * scale, oy + q[1] * scale] : null;
  };

  // 单帧原始检测框（细青色框，未进 tracker 时也能实时看到 YOLO 检出）
  if (vs.detections && vs.detections.length) {
    vctx.lineWidth = 1.6;
    vctx.strokeStyle = 'rgba(56, 189, 248, 0.9)';
    for (const d of vs.detections) {
      vctx.beginPath();
      for (let k = 0; k < 4; k++) {
        const x = ox + d[k * 2] * scale, y = oy + d[k * 2 + 1] * scale;
        k ? vctx.lineTo(x, y) : vctx.moveTo(x, y);
      }
      vctx.closePath();
      vctx.stroke();
    }
  }

  // 滤波装甲板重投影
  let onScreen = false;
  vs.armors.forEach((a, i) => {
    const px = (vs.armor_pixels || [])[i];
    if (!px) return;
    const corners = [];
    for (let k = 0; k < 4; k++) corners.push([ox + px[k * 2] * scale, oy + px[k * 2 + 1] * scale]);
    onScreen = true;
    const seen = i === vs.current_armor;
    vctx.lineWidth = seen ? 1.8 : 1.3;
    vctx.strokeStyle = seen ? 'rgba(52, 211, 153, 0.92)' : 'rgba(248, 113, 113, 0.72)';
    vctx.fillStyle = seen ? 'rgba(52, 211, 153, 0.08)' : 'rgba(248, 113, 113, 0.06)';
    vctx.beginPath();
    corners.forEach((c, k) => k ? vctx.lineTo(c[0], c[1]) : vctx.moveTo(c[0], c[1]));
    vctx.closePath();
    vctx.fill();
    vctx.stroke();
  });

  // 精致瞄准准星
  if (vs.aim[0]) {
    const s = sp([vs.aim[1], vs.aim[2], vs.aim[3]]);
    if (s) {
      vctx.strokeStyle = '#fb923c';
      vctx.lineWidth = 1.6;
      vctx.beginPath();
      vctx.arc(s[0], s[1], 5, 0, Math.PI * 2);
      vctx.moveTo(s[0] - 11, s[1]); vctx.lineTo(s[0] - 6, s[1]);
      vctx.moveTo(s[0] + 6, s[1]); vctx.lineTo(s[0] + 11, s[1]);
      vctx.moveTo(s[0], s[1] - 11); vctx.lineTo(s[0], s[1] - 6);
      vctx.moveTo(s[0], s[1] + 6); vctx.lineTo(s[0], s[1] + 11);
      vctx.stroke();
    }
  }

  if (vs.tracked && !onScreen) {
    vctx.fillStyle = 'rgba(251, 191, 36, 0.85)';
    vctx.font = '12px sans-serif';
    vctx.fillText('目标在相机视野外', 14, h - 14);
  }
}

function updateOrbitCamera() {
  const cp = Math.cos(orbitPitch), sp = Math.sin(orbitPitch);
  const offset = V(
    orbitDist * cp * Math.cos(orbitYaw),
    orbitDist * cp * Math.sin(orbitYaw),
    orbitDist * sp
  );
  camera.position.copy(orbitTarget).add(offset);
  camera.lookAt(orbitTarget);
}
function resetOrbitCamera() {
  orbitYaw = Math.PI + 0.22; orbitPitch = 0.44; orbitDist = 3.8;
  updateOrbitCamera();
}

{

function updateScene(s) {
  const nowMs = performance.now();
  const sp = s.self_pos || [0, 0, 0];

  const gx = -(((sp[0] % 2) + 2) % 2);
  const gy = -(((sp[1] % 2) + 2) % 2);
  groundGroup.position.copy(V(gx, gy, 0));

  if (selfTrailWorld.length >= 2) {
    const arr = [];
    for (const p of selfTrailWorld) {
      const v = V(p[0] - sp[0], p[1] - sp[1], -0.26);
      arr.push(v.x, v.y, v.z);
    }
    selfTrailGeo.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    selfTrailGeo.computeBoundingSphere();
    selfTrailLine.visible = true;
  } else selfTrailLine.visible = false;

  if (enemyTrailWorld.length >= 2) {
    const arr = [];
    for (const p of enemyTrailWorld) {
      const v = V(p[0] - sp[0], p[1] - sp[1], p[2] - sp[2]);
      arr.push(v.x, v.y, v.z);
    }
    enemyTrailGeo.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    enemyTrailGeo.computeBoundingSphere();

  } else enemyTrailLine.visible = false;

  if (s.geom) {
    if (s.geom.camera) {
      camBody.position.set(s.geom.camera[0], s.geom.camera[1], s.geom.camera[2]);
      camLens.position.set(s.geom.camera[0] + 0.04, s.geom.camera[1], s.geom.camera[2]);

      muzzleTip.position.set(0.49, s.geom.muzzle[1], s.geom.muzzle[2]);

  const mz = s.muzzle || s.gimbal;
  const Rm = mul(rz(mz[0]), ry(mz[1]));
  orient(gimbal, [
    V(Rm[0][0], Rm[1][0], Rm[2][0]),
    V(Rm[0][1], Rm[1][1], Rm[2][1]),

    const roll = a[4] || 0, pitch = a[5] || 0;
    ringRoll = roll; ringPitch = pitch;
    const mount = (s.target === 'outpost') ? -15 * Math.PI / 180 : 15 * Math.PI / 180;
    const Ra = mul(mul(ry(pitch), rx(roll)), mul(rz(a[3]), ry(mount)));
    orient(g, [
      V(Ra[0][0], Ra[1][0], Ra[2][0]),
      V(Ra[0][1], Ra[1][1], Ra[2][1]),
      V(Ra[0][2], Ra[1][2], Ra[2][2]),
    ]);

    if (center) {
      const cV = V(center[0], center[1], center[2]);
      const aV = V(a[0], a[1], a[2]);
      spokeArr.push(cV.x, cV.y, cV.z, aV.x, aV.y, aV.z);
      sumR += Math.hypot(a[0] - center[0], a[1] - center[1]);
    }
  });

  if (s.tracked && center && s.armors.length) {
    enemyRig.visible = true;
    enemyRig.position.copy(V(center[0], center[1], center[2]));
    const Rring = mul(ry(ringPitch), rx(ringRoll));
    orient(enemyRig, [
      V(Rring[0][0], Rring[1][0], Rring[2][0]),
      V(Rring[0][2], Rring[1][2], Rring[2][2]),
      V(-Rring[0][1], -Rring[1][1], -Rring[2][1]),
    ]);
    const avgR = Math.max(0.14, sumR / s.armors.length);
    enemyRing.scale.set(avgR, 1, avgR);

    spokeGeo.setAttribute('position', new THREE.Float32BufferAttribute(spokeArr, 3));
    spokeGeo.computeBoundingSphere();
    spokeLines.visible = true;

    const spd = Math.hypot(vel[0], vel[1], vel[2]);
    if (spd > 0.08) {
      enemyVelArrow.visible = true;
      enemyVelArrow.position.copy(V(center[0], center[1], center[2]));
      enemyVelArrow.setDirection(V(vel[0], vel[1], vel[2]).normalize());
      enemyVelArrow.setLength(Math.min(1.4, 0.25 + spd * 0.4), 0.11, 0.055);
    } else enemyVelArrow.visible = false;
  } else {
    enemyRig.visible = false;
    spokeLines.visible = false;
    enemyVelArrow.visible = false;
  }

  aimMesh.visible = s.aim[0];
  if (s.aim[0]) aimMesh.position.copy(V(s.aim[1], s.aim[2], s.aim[3]));

  const traj = trajectoryPoints(s);
  if (traj) {
    const arr = [];
    for (const p of traj) { const v = V(p[0], p[1], p[2]); arr.push(v.x, v.y, v.z); }
    trajGeo.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    trajGeo.computeBoundingSphere();
    trajLine.visible = true;
  } else trajLine.visible = false;

  const bullets = s.bullets || [];
  for (let i = 0; i < bulletMeshes.length; i++) {
    if (i < bullets.length) {
      bulletMeshes[i].visible = true;
      bulletMeshes[i].position.copy(V(bullets[i][0], bullets[i][1], bullets[i][2]));
    } else bulletMeshes[i].visible = false;
  }

  for (let i = 0; i < hitFxPool.length; i++) {
    const grp = hitFxPool[i];
    if (i < activeHitFx.length) {
      const fx = activeHitFx[activeHitFx.length - 1 - i];
      const prog = Math.max(0, Math.min(1, (nowMs - fx.bornMs) / 460));
      grp.visible = true;
      grp.position.copy(V(fx.x, fx.y, fx.z));
      grp.userData.ring.lookAt(camera.position);
      const rs = 0.7 + prog * 3.8;
      grp.userData.ring.scale.set(rs, rs, 1);
      grp.userData.ringMat.opacity = (1 - prog) * 0.85;
      const cs = 1.2 * (1 - prog * 0.7);
      grp.userData.core.scale.set(cs, cs, cs);
      grp.userData.coreMat.opacity = Math.max(0, 1 - prog * 1.5);
    } else grp.visible = false;
  }

  const deg = r => (r * 180 / Math.PI).toFixed(1);
  const spd = Math.hypot(vel[0], vel[1], vel[2]);
  status.textContent =
    `炮口 ${deg(mz[0])}°/${deg(mz[1])}°  ·  ` +
    `指令 ${s.command[0] ? deg(s.command[1]) + '°/' + deg(s.command[2]) + '°' : 'OFF'}  ·  ` +
    `敌速 ${spd.toFixed(2)}m/s  ·  我方 (${sp[0].toFixed(1)}, ${sp[1].toFixed(1)})m`;
}

// ---- 图表工具 ----
function setupChartCanvas(canvas, ctx, bg = '#111620') {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  return { w, h };
}

// ---- 左下：云台跟踪 + 命中率双轴曲线 ----
function drawYawChart() {
  const { w, h } = setupChartCanvas(yawChart, yawCtx);
  const padL = 44, padR = 38, padT = 34, padB = 18;
  const pw = Math.max(10, w - padL - padR), ph = Math.max(10, h - padT - padB);
  if (yawHistory.length < 2) return;

  const tMax = yawHistory[yawHistory.length - 1].t;
  const tMin = Math.max(0, tMax - HISTORY_WINDOW_S);
  let yMin = Infinity, yMax = -Infinity;
  for (const p of yawHistory) {
    yMin = Math.min(yMin, p.gimbal);
    yMax = Math.max(yMax, p.gimbal);
    if (p.control) {
      yMin = Math.min(yMin, p.ref, p.cmd);
      yMax = Math.max(yMax, p.ref, p.cmd);
    }
  }
  const span = Math.max(4, yMax - yMin);
  yMin -= span * 0.14; yMax += span * 0.14;

  const tx = t => padL + ((t - tMin) / Math.max(1e-3, HISTORY_WINDOW_S)) * pw;
  const ty = y => padT + (1 - (y - yMin) / Math.max(1e-3, yMax - yMin)) * ph;
  const tyHit = r => padT + (1 - r / 100) * ph;

  // 柔和水平网格 + 左右双刻度
  yawCtx.strokeStyle = 'rgba(148, 163, 184, 0.09)';
  yawCtx.lineWidth = 1;
  yawCtx.font = '10px ui-monospace, monospace';
  for (let i = 0; i <= 3; i++) {
    const frac = i / 3;
    const y = yMin + (yMax - yMin) * frac;
    const py = ty(y);
    yawCtx.beginPath(); yawCtx.moveTo(padL, py); yawCtx.lineTo(padL + pw, py); yawCtx.stroke();
    yawCtx.fillStyle = '#64748b';
    yawCtx.fillText(`${y.toFixed(1)}°`, 4, py + 3);
    yawCtx.fillStyle = 'rgba(192, 132, 252, 0.55)';
    yawCtx.fillText(`${Math.round(frac * 100)}%`, padL + pw + 6, py + 3);
  }

  // 开火区间：合并连续 shoot 段，画底纹 + 底部高亮条 + 时长标注
  const fireSpans = [];
  let spanStart = -1;
  let fireSamples = 0;
  for (let i = 0; i < yawHistory.length; i++) {
    if (yawHistory[i].shoot) {
      fireSamples++;
      if (spanStart < 0) spanStart = i;
    } else if (spanStart >= 0) {
      fireSpans.push([spanStart, i - 1]);
      spanStart = -1;
    }
  }
  if (spanStart >= 0) fireSpans.push([spanStart, yawHistory.length - 1]);

  let spanDurSumMs = 0;
  let spanDurCount = 0;
  for (const [i0, i1] of fireSpans) {
    const t0 = i0 > 0 ? yawHistory[i0 - 1].t : yawHistory[i0].t;
    const t1 = yawHistory[i1].t;
    const x0 = tx(t0), x1 = tx(t1);
    const bw = Math.max(2, x1 - x0);
    const durMs = Math.max(0, (t1 - t0) * 1000);
    if (i0 > 0 && i1 < yawHistory.length - 1 && durMs >= 5) {
      spanDurSumMs += durMs;
      spanDurCount++;
    }
    yawCtx.fillStyle = 'rgba(251, 191, 36, 0.13)';
    yawCtx.fillRect(x0, padT, bw, ph);
    yawCtx.fillStyle = 'rgba(251, 191, 36, 0.8)';
    yawCtx.fillRect(x0, padT + ph - 3, bw, 3);
    if (bw >= 30 && durMs >= 5) {
      yawCtx.fillStyle = 'rgba(254, 240, 138, 0.85)';
      yawCtx.font = '10px ui-monospace, monospace';
      yawCtx.fillText(`${Math.round(durMs)}ms`, x0 + 3, padT + ph - 6);
    }
  }
  const fireDutyPct = (fireSamples / yawHistory.length) * 100;
  const avgSpanMs = spanDurCount > 0 ? (spanDurSumMs / spanDurCount) : 0;

  // 命中率淡紫曲线（副轴 0~100%）
  yawCtx.strokeStyle = 'rgba(192, 132, 252, 0.55)';
  // 重建命中率（紫）
  yawCtx.lineWidth = 1.4;
  yawCtx.beginPath();
  yawHistory.forEach((p, i) => {
    const x = tx(p.t), y = tyHit(p.hitRate);
    i ? yawCtx.lineTo(x, y) : yawCtx.moveTo(x, y);
  });
  yawCtx.stroke();

  // 仿真实际命中率（琥珀虚线）
  if (yawHistory.some(p => p.hasSim)) {
    yawCtx.save();
    yawCtx.strokeStyle = '#f59e0b';
    yawCtx.lineWidth = 1.6;
    yawCtx.setLineDash([5, 3]);
    yawCtx.beginPath();
    let startedSim = false;
    for (const p of yawHistory) {
      if (!p.hasSim) { startedSim = false; continue; }
      const x = tx(p.t), y = tyHit(p.simHitRate);
      startedSim ? yawCtx.lineTo(x, y) : yawCtx.moveTo(x, y);
      startedSim = true;
    }
    yawCtx.stroke();
    yawCtx.restore();
  }

  // 预补偿指令虚线
  yawCtx.save();
  yawCtx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
  yawCtx.lineWidth = 1.2;
  yawCtx.setLineDash([4, 4]);
  yawCtx.beginPath();
  let started = false;
  for (const p of yawHistory) {
    if (!p.control) { started = false; continue; }
    const x = tx(p.t), y = ty(p.cmd);
    started ? yawCtx.lineTo(x, y) : yawCtx.moveTo(x, y);
    started = true;
  }
  yawCtx.stroke();
  yawCtx.restore();

  // 目标理想角（青）
  yawCtx.strokeStyle = '#38bdf8';
  yawCtx.lineWidth = 1.8;
  yawCtx.beginPath();
  started = false;
  for (const p of yawHistory) {
    if (!p.control) { started = false; continue; }
    const x = tx(p.t), y = ty(p.ref);
    started ? yawCtx.lineTo(x, y) : yawCtx.moveTo(x, y);
    started = true;
  }
  yawCtx.stroke();

  // 实测炮口角（翠绿）：跳过异步拍频造成的单/双拍重复冻结点，再用二次中点样条连结真实更新点，
  // 既 100% 忠于真实炮口采样（不做外推），又彻底消除水平台阶感。
  const gimbalPts = [];
  for (let i = 0; i < yawHistory.length; i++) {
    const p = yawHistory[i];
    if (gimbalPts.length === 0 || i === yawHistory.length - 1) {
      gimbalPts.push(p);
      continue;
    }
    const prev = gimbalPts[gimbalPts.length - 1];
    // 角度变化或已静止超过 35ms 时保留采样点，避免真正静止段被拉斜
    if (Math.abs(p.gimbal - prev.gimbal) > 1e-3 || (p.t - prev.t) >= 0.035) {
      gimbalPts.push(p);
    }
  }
  yawCtx.strokeStyle = '#34d399';
  yawCtx.lineWidth = 1.8;
  yawCtx.beginPath();
  if (gimbalPts.length === 1) {
    yawCtx.moveTo(tx(gimbalPts[0].t), ty(gimbalPts[0].gimbal));
  } else if (gimbalPts.length > 1) {
    yawCtx.moveTo(tx(gimbalPts[0].t), ty(gimbalPts[0].gimbal));
    for (let i = 1; i < gimbalPts.length - 1; i++) {
      const xc = tx(gimbalPts[i].t), yc = ty(gimbalPts[i].gimbal);
      const xn = tx(gimbalPts[i + 1].t), yn = ty(gimbalPts[i + 1].gimbal);
      yawCtx.quadraticCurveTo(xc, yc, 0.5 * (xc + xn), 0.5 * (yc + yn));
    }
    const lastP = gimbalPts[gimbalPts.length - 1];
    yawCtx.lineTo(tx(lastP.t), ty(lastP.gimbal));
  }
  yawCtx.stroke();

  const last = yawHistory[yawHistory.length - 1];
  const m = (state && state.metrics) || { yaw_err_rms: 0, shots: 0, resolved: 0 };
  const errDeg = last.control ? wrapDeg(last.gimbal - last.ref) : 0;
  const spanStr = avgSpanMs > 0 ? ` (${Math.round(avgSpanMs)}ms/次)` : '';
  yawMeta.textContent = last.control
    ? `开火区间 ${fireDutyPct.toFixed(1)}%${spanStr}  ·  实时误差 ${errDeg >= 0 ? '+' : ''}${errDeg.toFixed(2)}°  ·  RMS ${(m.yaw_err_rms * 180 / Math.PI).toFixed(2)}°  ·  飞行中 ${m.shots - m.resolved}`
    : 'control: OFF';
}

// ---- 右下：弹道闭环干净 2D 误差靶图 + 结构化数值面板 ----
function drawCorrectorPanel() {
  const c = state && state.corrector;
  if (!c) {
    corrBody.style.display = 'none';
    corrEmpty.style.display = 'flex';
    corrLegend.style.display = 'none';
    corrMeta.textContent = '未启用';
    return;
  }

  corrBody.style.display = 'grid';
  corrEmpty.style.display = 'none';
  corrLegend.style.display = 'inline';
  btnCorrAuto.textContent = c.auto_apply ? '自动: ON' : '自动: OFF';
  btnCorrAuto.classList.toggle('active', !!c.auto_apply);
  corrMeta.textContent = `配对 ${c.matched}/${c.shots} · 飞行 ${c.live} · 检出 ${c.blobs} · ${c.det_ms.toFixed(2)}ms`;

  const fmtS = v => `${v >= 0 ? '+' : ''}${v.toFixed(2)}°`;
  stErr.textContent = `Y ${fmtS(c.est.ey)}  P ${fmtS(c.est.ep)}`;
  stSigma.textContent = `Y ±${c.est.sy.toFixed(2)}°  P ±${c.est.sp.toFixed(2)}°`;
  stCur.textContent = `Y ${fmtS(c.current.yaw_offset)}  P ${fmtS(c.current.pitch_offset)}`;
  stSugLbl.textContent = c.est.ok
    ? `建议零偏 (${c.est.n}发 就绪)`
    : `建议零偏 (${c.est.n}/${c.min_shots}发)`;
  stSug.textContent = `Y ${fmtS(c.suggest.yaw_offset)}  P ${fmtS(c.suggest.pitch_offset)}`;

  // 独立干净的极坐标误差靶图
  const { w, h } = setupChartCanvas(corrChart, corrCtx, '#111620');
  const cx = w * 0.5, cy = h * 0.5;
  const R = Math.max(24, Math.min(w, h) * 0.42);

  const results = c.results || [];
  let maxAbs = 1.5;
  for (const r of results) maxAbs = Math.max(maxAbs, Math.abs(r.ey), Math.abs(r.ep));
  if (c.est && c.est.n > 0) {
    maxAbs = Math.max(maxAbs, Math.abs(c.est.ey) + c.est.sy, Math.abs(c.est.ep) + c.est.sp);
  }
  if (c.current) {
    maxAbs = Math.max(maxAbs, Math.abs(c.current.yaw_offset), Math.abs(c.current.pitch_offset));
  }
  const maxDeg = Math.ceil(maxAbs * 2) / 2;
  const px = ey => cx + (ey / maxDeg) * R;
  const py = ep => cy - (ep / maxDeg) * R;

  // 靶底淡圆与刻度
  corrCtx.fillStyle = '#161d2b';
  corrCtx.beginPath(); corrCtx.arc(cx, cy, R, 0, Math.PI * 2); corrCtx.fill();

  corrCtx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
  corrCtx.lineWidth = 1;
  for (const f of [0.5, 1.0]) {
    corrCtx.beginPath(); corrCtx.arc(cx, cy, R * f, 0, Math.PI * 2); corrCtx.stroke();
  }
  corrCtx.beginPath();
  corrCtx.moveTo(cx - R - 4, cy); corrCtx.lineTo(cx + R + 4, cy);
  corrCtx.moveTo(cx, cy - R - 4); corrCtx.lineTo(cx, cy + R + 4);
  corrCtx.stroke();

  corrCtx.fillStyle = '#64748b';
  corrCtx.font = '10px ui-monospace, monospace';
  corrCtx.fillText(`+${maxDeg.toFixed(1)}°`, cx + R - 24, cy - 4);
  corrCtx.fillText(`+P`, cx + 4, cy - R + 10);

  // 每发散点
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    const alpha = 0.25 + 0.75 * ((i + 1) / Math.max(1, results.length));
    const x = px(r.ey), y = py(r.ep);
    corrCtx.fillStyle = `rgba(192, 132, 252, ${alpha.toFixed(2)})`;
    corrCtx.beginPath();
    corrCtx.arc(x, y, i === results.length - 1 ? 3.8 : 2.6, 0, Math.PI * 2);
    corrCtx.fill();
    if (i === results.length - 1) {
      corrCtx.strokeStyle = '#f8fafc';
      corrCtx.lineWidth = 1;
      corrCtx.stroke();
    }
  }

  // 当前零偏抵消点（翠绿菱形）
  if (c.current) {
    const ox = px(-c.current.yaw_offset), oy = py(-c.current.pitch_offset);
    corrCtx.strokeStyle = '#34d399';
    corrCtx.lineWidth = 1.6;
    corrCtx.beginPath();
    corrCtx.moveTo(ox, oy - 5); corrCtx.lineTo(ox + 5, oy);
    corrCtx.lineTo(ox, oy + 5); corrCtx.lineTo(ox - 5, oy);
    corrCtx.closePath();
    corrCtx.stroke();
  }

  // 中位数估计与 ±1σ 椭圆（青）
  if (c.est && c.est.n > 0) {
    const ex = px(c.est.ey), eyPx = py(c.est.ep);
    const rxPx = Math.max(2, (c.est.sy / maxDeg) * R);
    const ryPx = Math.max(2, (c.est.sp / maxDeg) * R);
    corrCtx.fillStyle = 'rgba(56, 189, 248, 0.14)';
    corrCtx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
    corrCtx.lineWidth = 1.2;
    corrCtx.beginPath(); corrCtx.ellipse(ex, eyPx, rxPx, ryPx, 0, 0, Math.PI * 2);
    corrCtx.fill(); corrCtx.stroke();

    corrCtx.strokeStyle = '#38bdf8';
    corrCtx.lineWidth = 1.8;
    corrCtx.beginPath();
    corrCtx.moveTo(ex - 6, eyPx); corrCtx.lineTo(ex + 6, eyPx);
    corrCtx.moveTo(ex, eyPx - 6); corrCtx.lineTo(ex, eyPx + 6);
    corrCtx.stroke();
  }
}

function resizeScene() {
  const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

(function loop() {
  drawView();
  if (state) updateScene(state);
  drawYawChart();
  drawCorrectorPanel();
  resizeScene();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
